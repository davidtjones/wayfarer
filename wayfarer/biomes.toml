# What lives in each kind of room, and where.
#
# One table per room theme, one sub-table per layer (grass, reeds, bushes,
# rocks, trees, and the undergrowth: ferns, flowers, heather, scrub). `biomes.py` reads this; `export.py` turns it into the
# maps and tree lists the game loads.
#
# A layer has an amount (`density`, or `cover` for trees) and, optionally, how
# it responds to the conditions at a spot. A response is a pair [none, full]:
# the layer is absent at the first value and at full strength at the second.
# Put the larger number first for something that likes less of a condition
# (`canopy = [0.9, 0.3]`: none under closed canopy, full in the open).
#
# Conditions measured on the world grid, each 0..1:
#   wet     drainage lines, hollows, ground beside a lake
#   shade   north-facing slopes
#   ridge   ground standing above its surroundings
#   high    closeness to the treeline
#   canopy  tree cover
#   edge    1 at the edge of a stand of trees, 0 deep inside or far outside
#   slope   steepness, as rise over run (not 0..1: 1.0 is 45 degrees)
#
# Conditions the game checks against the exact ground height, in metres above
# the water surface (negative = under water):
#   above_lake, above_sea   [none, full], for grass
#   band                    [lowest, highest], for reeds (lakes only)
#
# Bushes grow in thickets. `amount` scales the whole layer (and takes the site
# responses above); the other keys weight where thickets form, each 0..1:
# `mantle` (around stands of trees), `gullies` (drainage lines), `banks` (above
# a lake shore), `hedges` (broken rows beside roads), `thickets` (clumps on
# open ground). `singles` is lone bushes per hectare outside thickets.
#
# Rooms blend into each other. `blend` is the distance in metres over which one
# room's life gives way to the next: short along a wall, long through a door,
# so a meadow reaches into the desert where the road goes through. `pairs`
# overrides the width for one pair of themes, wall or door.

[blend]
wall = 50
open = 400                # a border with no mountains or cliff on it
door = 220
door_reach = 140          # how far along the border a door's wide blend extends

[blend.pairs]
"desert-field" = 320
"desert-lake" = 280
"ash-forest" = 120

# --- field: open farmland and meadow ---------------------------------------

[field.grass]
density = 1.0
above_lake = [0.2, 0.7]
above_sea = [1.4, 2.8]

[field.reeds]
density = 0.6
band = [-0.50, 0.45]

[field.bushes]
amount = 1.0
mantle = 0.9
gullies = 0.8
banks = 0.6
hedges = 0.7
thickets = 0.45
singles = 1.0

[field.flowers]
density = 0.55
canopy = [0.6, 0.15]

[field.ferns]
density = 0.12
wet = [0.3, 0.8]

[field.rocks]
density = 0.20

[field.trees]
cover = 0.22              # how readily stands form
limit = 1.0               # most canopy this theme allows
copses = 1.0              # small clumps on open ground
oak = 0.5

